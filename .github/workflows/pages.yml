name: Publish voting demo to GitHub Pages

on:
  push:
    branches: [isuru]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require a Sepolia deployment
        run: |
          node -e 'const d=require("./frontend/src/contracts/VotingSystem.json"); if(d.network!=="sepolia" || !/^0x[0-9a-fA-F]{40}$/.test(d.address) || /^0x0{40}$/.test(d.address)) { console.error("Deploy the contract to Sepolia and commit its public deployment JSON first."); process.exit(1); }'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
